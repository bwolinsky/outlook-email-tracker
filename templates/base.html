<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Outlook Email Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #0078d4;
      --accent-light: #e8f2fc;
    }
    body { background: #f4f6f9; }
    .navbar { background: var(--accent) !important; }
    .navbar-brand, .navbar-text { color: #fff !important; }
    .topic-card { transition: box-shadow .15s; cursor: pointer; }
    .topic-card:hover { box-shadow: 0 4px 16px rgba(0,120,212,.18); }
    .priority-high   { border-left: 4px solid #dc3545; }
    .priority-medium { border-left: 4px solid #ffc107; }
    .priority-low    { border-left: 4px solid #198754; }
    .log-entry { font-size: .82rem; }
    .badge-topic { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-envelope-open me-2"></i>Outlook Email Tracker</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="navbar-text" id="nav-stats"></span>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    const el = document.getElementById('nav-stats');
    if (el) el.textContent = `${d.total_emails} emails · ${d.total_topics} topics`;
  } catch(e) {}
}
loadStats();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
